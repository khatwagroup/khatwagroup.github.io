<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f4;--card:#ffffff;--ink:#10201f;--mute:#5f6f6d;--line:#e2e8e6;
  --side:#0c1d1f;--side2:#13292b;--side-ink:#cfe0dd;
  --pri:#0f766e;--pri-2:#14b8a6;--pri-soft:#e3f4f1;--gold:#e0a63a;--gold-soft:#fdf3e1;
  --in:#0f8a5f;--in-soft:#e2f5ec;--out:#d1435b;--out-soft:#fdebee;--warn:#b7791f;--warn-soft:#fdf3e1;
  --r:16px;--sh:0 1px 2px rgba(12,29,31,.05),0 4px 14px rgba(12,29,31,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0a1415;--card:#122224;--ink:#e6efed;--mute:#93a7a4;--line:#21393b;--side:#071012;--side2:#0e1e20;
  --pri:#2dd4bf;--pri-2:#5eead4;--pri-soft:#123634;--gold:#f0b85a;--gold-soft:#3a2d14;
  --in:#34d399;--in-soft:#0f3326;--out:#fb7185;--out-soft:#3b1820;--warn:#f0b85a;--warn-soft:#3a2d14;--sh:none}}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic",Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
html,body{height:100%}
body{padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
.app{display:flex;min-height:100vh;min-height:100dvh;width:100%}
aside{width:240px;background:linear-gradient(180deg,var(--side),var(--side2));color:var(--side-ink);padding:20px 12px;position:sticky;top:0;height:100vh;height:100dvh;flex-shrink:0;overflow-y:auto;display:flex;flex-direction:column}
.side-foot{margin-top:auto;padding:12px 6px 4px}
.side-foot .btn{width:100%;justify-content:center;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:var(--side-ink)}
.fsbtn{font-size:18px;padding:6px 10px;margin-inline-start:auto}
.btn.fs-m{display:none}
@media (max-width:760px){.btn.fs-m{display:inline-flex}}
:fullscreen body,:fullscreen{background:var(--bg)}
.brand{padding:4px 8px 22px;display:flex;gap:10px;align-items:center}
.brand .logo{width:52px;height:52px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 2px rgba(224,166,58,.5)}
.ttl{display:flex;align-items:center;gap:10px}.toplogo{display:none;width:40px;height:40px;border-radius:50%}
.slip-brand{display:inline-flex;align-items:center;gap:10px}.slip-brand img{width:46px;height:46px;border-radius:50%}.slip-brand b{font-size:17px}
.docprev{background:#e9ecea;border-radius:12px;padding:8px;overflow:auto;max-height:60vh}.docprev .kd{margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.brand b{display:block;color:#fff;font-size:15px;line-height:1.3}
.brand small{color:#8fb3ae;font-size:11.5px}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;color:var(--side-ink);text-decoration:none;font-weight:500;margin-bottom:2px;font-size:14.5px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(20,184,166,.16);color:#fff;font-weight:700;box-shadow:inset -3px 0 0 var(--gold)}
.nav .ic{width:20px;text-align:center;color:var(--pri-2);font-size:14px}
main{flex:1;min-width:0;padding:24px 28px 60px}
@media (min-width:1600px){main{padding:28px 40px 60px}.g4{gap:18px}.kpi .v{font-size:26px}}
@media (max-width:1100px) and (min-width:761px){aside{width:200px}.nav a{font-size:13.5px;padding:8px 10px}main{padding:20px}}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.2px}
.status{font-size:12.5px;color:var(--mute)}
.status.warn{color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card h3,h3{margin:0 0 12px;font-size:16px;font-weight:700}
.sec-t{margin:22px 0 10px;font-size:13px;font-weight:700;color:var(--mute);display:flex;align-items:center;gap:8px}
.sec-t::before{content:"";width:18px;height:3px;border-radius:2px;background:var(--gold)}
.kpi{position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;top:0;right:0;width:4px;height:100%;background:var(--pri-2);opacity:.55}
.kpi .l{color:var(--mute);font-size:13px;font-weight:600}
.kpi .v{font-size:22px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--mute);margin-top:3px}
.pos{color:var(--in)}.neg{color:var(--out)}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-size:14px}
.btn:hover{border-color:var(--pri-2)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.g{background:var(--in);border-color:var(--in);color:#fff}
.btn.r{background:var(--out);border-color:var(--out);color:#fff}
.login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 0%,#1d3a3d,#0a1517 70%)}
.login.hidden{display:none}
.lbox{background:var(--card);border-radius:22px;padding:28px 24px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lbox h2{margin:4px 0 2px;font-size:19px}
.llogo{width:110px;height:110px;border-radius:50%;box-shadow:0 0 0 3px rgba(224,166,58,.55);margin-bottom:8px}
.lbox input{margin-bottom:10px;padding:12px 14px;font-size:16px;text-align:left}
.lerr{color:var(--out);font-size:13.5px;margin-top:10px;min-height:18px}
.hidden{display:none}
.signin-note{border:1.5px solid var(--gold);background:var(--gold-soft);margin-bottom:14px;display:flex;flex-direction:column;gap:6px}
.btn.xl{border-color:#1d6f42;color:#1d6f42}
.btn.wa{background:#1faa59;border-color:#1faa59;color:#fff}
.btn.wa::before{content:"";width:8px;height:8px;border-radius:50%;background:#c8f7d8}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--pri)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri-2);box-shadow:0 0 0 3px var(--pri-soft)}
.row input,.row select{width:auto}
.search input{width:100%;padding:13px 16px;font-size:15px;border-radius:14px;background:var(--card);box-shadow:var(--sh)}
.chip{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;background:var(--card)}
.chip input{width:auto}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--bg);font-size:12.5px;color:var(--mute);font-weight:700;position:sticky;top:0}
tbody tr:hover{background:color-mix(in srgb,var(--pri-soft) 45%,transparent)}
tr:last-child td{border-bottom:none}
tfoot td{font-weight:800;background:var(--bg)}
td.num,th.num{font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.b-in{background:var(--in-soft);color:var(--in)}.b-out{background:var(--out-soft);color:var(--out)}
.b-w{background:var(--warn-soft);color:var(--warn)}.b-p{background:var(--pri-soft);color:var(--pri)}
.b-m{background:var(--bg);color:var(--mute)}
.empty{padding:30px;text-align:center;color:var(--mute)}
.muted{color:var(--mute);font-size:13px}
.mt{margin-top:14px}
.bars{display:flex;align-items:flex-end;gap:14px;height:180px;padding-top:10px}
.bars .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.bars .pair{flex:1;display:flex;align-items:flex-end;gap:4px;width:100%;justify-content:center}
.bars .b{width:40%;max-width:24px;border-radius:6px 6px 0 0;min-height:2px}
.bars .lb{font-size:12px;color:var(--mute)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:middle}
.hbar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;margin-top:4px}
.hbar>div{height:100%;border-radius:4px}
.list .it,.slip .it{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:10px}
.list .it:last-child{border-bottom:none}
.modal{position:fixed;inset:0;background:rgba(6,16,17,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.hidden{display:none}
.box{background:var(--card);border-radius:18px;width:100%;max-width:580px;max-height:92vh;overflow:auto;padding:22px}
.box.wide{max-width:880px}
.box h2{margin:0 0 14px;font-size:19px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .f{display:flex;flex-direction:column;gap:5px}
.form .f.full{grid-column:1/-1}
.form label{font-size:13px;font-weight:600;color:var(--mute)}
.form .chk{flex-direction:row;align-items:center;gap:8px}
.form .chk input{width:auto}
.acts{display:flex;gap:8px;justify-content:flex-start;margin-top:18px;flex-wrap:wrap}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--side);color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
.slip{border:1px solid var(--line);border-radius:14px;padding:18px;background:linear-gradient(180deg,var(--pri-soft),transparent 120px)}
.slip .sec{color:var(--pri);font-size:14px;margin-bottom:2px}
.slip .tot{font-weight:800;font-size:19px;border:none;padding-top:12px;color:var(--pri)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:12px;width:fit-content}
.tabs button{border:none;background:transparent;padding:6px 16px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--mute)}
.tabs button.on{background:var(--pri);color:#fff}
.savebar{position:sticky;bottom:12px;margin-top:16px;display:flex;justify-content:flex-start}
.savebar .btn{box-shadow:0 6px 20px rgba(15,118,110,.35);padding:12px 22px}
.irow{display:grid;grid-template-columns:3fr 1fr 1.4fr 34px;gap:6px;margin-bottom:8px;align-items:center}
.irow.k3{grid-template-columns:1fr 1fr 1fr 34px}
.irow input{min-width:0}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .irow{grid-template-columns:1fr 1.4fr 34px;padding-bottom:8px;border-bottom:1px dashed var(--line)}.irow .d{grid-column:1/-1}.irow.muted{display:none}
  .irow.k3{grid-template-columns:1fr 1fr 1fr 34px;border:none}
  aside{position:fixed;bottom:0;top:auto;right:0;left:0;width:100%;height:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40;background:var(--side);display:block}
  .side-foot{display:none}
  input,select,textarea{font-size:16px}
  .brand{display:none}.toplogo{display:block}
  .nav{display:flex;overflow-x:auto;gap:2px;scrollbar-width:none}
  .nav a{flex-direction:column;gap:1px;font-size:10.5px;padding:6px 6px;min-width:72px;text-align:center;margin:0}
  .nav a.on{box-shadow:inset 0 -3px 0 var(--gold)}
  .nav .ic{font-size:16px}
  main{padding:14px 12px calc(96px + env(safe-area-inset-bottom))}
  .top{position:sticky;top:0;z-index:30;background:var(--bg);margin:-14px -12px 12px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .top .row{width:100%}
  .modal{padding:0;align-items:flex-end}
  .box{max-width:none!important;border-radius:20px 20px 0 0;max-height:94dvh;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .g2{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .kpi .v{font-size:18px}
  .top h1{font-size:20px}
  .box{padding:16px}
}
</style>
</head>
<body>
<div class="app">
  <aside><div class="brand"><img class="logo" id="brandLogo" alt=""><div><b id="brandName">الحسابات</b><small>نظام الإدارة المالية</small></div></div><nav class="nav" id="nav"></nav><div class="side-foot"><div class="muted" id="whoami" style="color:#8fb3ae;text-align:center;margin-bottom:6px;font-size:12px;word-break:break-all"></div><button class="btn fs-only" onclick="toggleFS()">⛶ ملء الشاشة</button><button class="btn" style="margin-top:6px" onclick="fbLogout()">⎋ تسجيل خروج</button></div></aside>
  <main>
    <div class="top"><div class="ttl"><img class="toplogo" id="topLogo" alt=""><div><h1 id="title"></h1><div class="status" id="status">جاري تحميل البيانات…</div></div><button class="btn sm ghost fsbtn fs-only fs-m" onclick="toggleFS()" title="ملء الشاشة">⛶</button></div><div class="row" id="topActs"></div></div>
    <div id="notice"></div><div id="view"></div>
  </main>
</div>
<div id="login" class="login hidden"><div class="lbox">
  <img id="loginLogo" alt="" class="llogo">
  <h2>خطوة جروب للتطوير العقاري</h2><div class="muted" style="margin-bottom:16px">نظام الإدارة المالية</div>
  <form id="lform" onsubmit="return false">
    <input id="lemail" type="email" placeholder="الإيميل" autocomplete="username" dir="ltr">
    <input id="lpass" type="password" placeholder="الباسورد" autocomplete="current-password" dir="ltr">
    <button class="btn p" id="lbtn" type="submit" style="width:100%;justify-content:center;padding:12px">دخول</button>
  </form>
  <div id="lerr" class="lerr"></div>
  <div class="row" style="justify-content:space-between;margin-top:10px"><button class="btn ghost sm" onclick="fbReset()">نسيت الباسورد؟</button><button class="btn ghost sm" onclick="cfgBox()">إعدادات الاتصال</button></div>
  <div id="cfgbox" class="hidden" style="margin-top:10px"><div class="muted">الصق كود firebaseConfig من Firebase هنا:</div><textarea id="cfgtxt" rows="6" dir="ltr" style="font-family:monospace;font-size:12px"></textarea><div class="row mt"><button class="btn p sm" onclick="cfgSave()">حفظ</button><button class="btn sm" onclick="cfgClear()">رجوع للافتراضي</button></div></div>
</div></div>
<div id="modal" class="modal hidden"><div class="box" id="mbox"></div></div>
<div id="toast"></div>

<script>
/* ============ أدوات ============ */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const curMonth=()=>today().slice(0,7);
const round=n=>Math.round((+n||0)*100)/100;
const fmt=n=>round(n).toLocaleString('en-US',{maximumFractionDigits:2});
const money=n=>fmt(n)+' '+cfg().currency;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AR_M=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const mName=m=>{if(!m)return '';const[y,mm]=m.split('-');return AR_M[+mm-1]+' '+y};
const addMonth=(m,k)=>{let[y,mm]=m.split('-').map(Number);mm+=k;while(mm>12){mm-=12;y++}while(mm<1){mm+=12;y--}return y+'-'+String(mm).padStart(2,'0')};
const monthDiff=(a,b)=>{const[y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return (y2-y1)*12+(m2-m1)};
const sumA=l=>l.reduce((s,x)=>s+(+x.amount||0),0);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
function setStatus(t,warn){const e=$('#status');e.textContent=t;e.className='status'+(warn?' warn':'')}

/* ============ البيانات ============ */
const COLS=['emp','tx','com','adj','pay','cfg','acct','trf','att','inv','cust','proj','unit','ctr','deal','plan','kpi','kpiv'];
const S={};COLS.forEach(c=>S[c]={});
let DB=null,mode='loading';
const DEF_CFG={company:'خطوة جروب للتطوير العقاري',waNumber:'01042166184',currency:'ج.م',insurance:0,workDays:30,workHours:8,otRate:1.5,vat:14,invPrefix:'KG-',phone:'01042166184',address:'',
  winterIn:'10:00',winterOut:'18:00',summerIn:'11:00',summerOut:'19:00',summerMonths:[5,6,7,8,9],weekOff:[4],lateRules:[{min:16,ded:0.25},{min:120,ded:0.5},{min:180,ded:1}],absExcused:1,absUnexcused:2,
  commResStart:4,commResStep:1,commComStart:6,commComStep:1,commMax:0,commReset:'month',
  incomeCats:['أقساط عملاء','مقدمات حجز وتعاقد','عمولات سمسرة وتسويق','إيجارات','خدمات','إيرادات أخرى'],
  expenseCats:['مرتبات وأجور','عمولات','سلف موظفين','أراضي','مقاولات وإنشاءات','خامات ومواد بناء','تصميمات واستشارات هندسية','تراخيص ورسوم حكومية','تسويق وإعلان','إيجار مقرات','كهرباء ومياه وإنترنت','نقل ومواصلات','صيانة','تأمينات وضرائب','مصروفات أخرى']};
const cfg=()=>Object.assign({},DEF_CFG,S.cfg.main||{});
const arr=c=>Object.entries(S[c]).map(([id,v])=>Object.assign({},v,{id}));
const emp=id=>S.emp[id]||{name:'(موظف محذوف)'};
const METHODS=['نقدي','تحويل بنكي','محفظة إلكترونية','شيك'];
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
/* الخزن والبنوك */
const ACCT_T={cash:'خزينة نقدية',bank:'حساب بنكي',wallet:'محفظة إلكترونية'};
function accounts(){const l=arr('acct');if(!S.acct.main)l.unshift({id:'main',name:'الخزينة الرئيسية',type:'cash',opening:0});return l.sort((a,b)=>(a.id==='main'?-1:b.id==='main'?1:(a.name||'').localeCompare(b.name||'','ar')))}
const acctName=id=>(accounts().find(a=>a.id===(id||'main'))||{name:'(حساب محذوف)'}).name;
const acctOpts=()=>accounts().map(a=>[a.id,a.name]);
function balance(id){
  const a=accounts().find(x=>x.id===id)||{};let b=+a.opening||0;
  arr('tx').forEach(t=>{if((t.acct||'main')===id)b+=(t.kind==='in'?1:-1)*(+t.amount||0)});
  arr('trf').forEach(t=>{if(t.from===id)b-=+t.amount||0;if(t.to===id)b+=+t.amount||0});
  return round(b);
}
const totalBalance=()=>round(accounts().reduce((s,a)=>s+balance(a.id),0));
/* الفواتير */
function invCalc(v){const sub=round((v.items||[]).reduce((s,i)=>s+(+i.qty||0)*(+i.price||0),0)),disc=+v.discount||0,taxable=round(sub-disc),tax=round(taxable*(+v.vat||0)/100);return{sub,disc,taxable,tax,total:round(taxable+tax)}}
const invPaid=id=>round(sumA(arr('tx').filter(t=>t.invId===id&&t.kind==='in')));
function invStatus(v){const t=invCalc(v).total,p=invPaid(v.id);if(p>=t-0.01)return['مدفوعة','b-in','paid'];if(v.due&&v.due<today())return[p>0?'متأخرة (جزئي)':'متأخرة','b-out','late'];if(p>0)return['مدفوعة جزئياً','b-p','part'];return['غير مدفوعة','b-w','open']}
const invRemain=v=>round(invCalc(v).total-invPaid(v.id));
const receivables=()=>round(arr('inv').reduce((s,v)=>s+Math.max(0,invRemain(v)),0));
const custName=id=>(S.cust[id]||{name:'(عميل محذوف)'}).name;

function persist(){try{localStorage.setItem('acc_sys_v1',JSON.stringify(S))}catch(e){}}
async function save(c,id,obj){
  S[c]=Object.assign({},S[c],{[id]:obj});scheduleRender();
  if(mode==='cloud'){try{await DB.collection(c).doc(id).set(obj)}catch(e){toast('تعذر الحفظ: '+(e.message||e.code||e))}}
  else persist();
}
async function del(c,id){
  const n=Object.assign({},S[c]);delete n[id];S[c]=n;scheduleRender();
  if(mode==='cloud'){try{await DB.collection(c).doc(id).delete()}catch(e){toast('تعذر الحذف')}}
  else persist();
}

async function init(){
  try{document.getElementById('brandLogo').src=LOGO;document.getElementById('topLogo').src=LOGO}catch(e){}
  window.addEventListener('hashchange',render);
  render();
  let db=null;
  db=await fbConnect();
  if(db){
    DB=db;mode='cloud';let pending=COLS.length;
    const timer=setTimeout(()=>{if(pending>0)setStatus('لم نتمكن من الوصول للبيانات بعد… قد تكون غير محدّثة',true)},10000);
    COLS.forEach(c=>{let done=false;
      DB.collection(c).onSnapshot(snap=>{
        const o={};snap.docs.forEach(d=>{if(d.exists)o[d.id]=d.data()});S[c]=o;
        if(!done&&!snap.metadata.fromCache){done=true;pending--;if(!pending){clearTimeout(timer);setStatus('✓ متصل — البيانات محفوظة أونلاين');checkLocalLeftovers()}}
        scheduleRender();
      },err=>{clearTimeout(timer);setStatus('خطأ في الاتصال بقاعدة البيانات',true)});
    });
    setStatus('جاري المزامنة…');
  }else{
    mode='local';
    try{const raw=localStorage.getItem('acc_sys_v1');if(raw){const o=JSON.parse(raw);COLS.forEach(c=>S[c]=o[c]||{})}}catch(e){}
    setStatus('⚠️ غير متصل — مش مسجل دخول',true);
    $('#notice').innerHTML=`<div class="card signin-note"><b>⚠️ مش متصل بقاعدة البيانات</b><div>اتأكد من الإنترنت وافتح الصفحة تاني.</div><div class="muted">أي حاجة هتسجلها دلوقتي هتتحفظ على الجهاز ده بس، ولما تسجل دخول البرنامج هيعرض عليك ترفعها أونلاين.</div></div>`;
  }
  render();
}
let rq=false;function scheduleRender(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()})}

const kpiTarget=(k,e)=>{const t=(k.targets||{})[e.id];return t!==undefined&&t!==''&&t!==null?+t:+k.target||0};
function kpiRule(k,v,e){
  if(k.mode!=='target'){const r=(k.ranges||[]).find(r=>v>=(+r.from||0)&&(r.to===''||r.to==null||v<=+r.to));return{amount:r?+r.amount||0:0,note:''}}
  const t=kpiTarget(k,e);
  if(v<t){const p=(k.penalties||[]).slice().sort((a,b)=>a.below-b.below).find(p=>v<(k.ptype==='pct'?t*p.below/100:+p.below));return{amount:-(p?+p.amount:+k.penalty||0),note:'أقل من المطلوب ('+fmt(t)+')',t}}
  const lv=(k.bonuses||[]).map(b=>({at:k.btype==='times'?t*(+b.at||0):+b.at||0,amount:+b.amount||0})).filter(b=>b.at>0).sort((a,b)=>b.at-a.at).find(b=>v>=b.at);
  return{amount:lv?lv.amount:0,note:lv?'وصل '+fmt(lv.at):'حقق المطلوب',t};
}
function kpiEval(e,m,att){
  const vals=(S.kpiv[m+'_'+e.id]||{}).vals||{},sl=allSales().filter(s=>s.emp===e.id&&(s.date||'').startsWith(m));
  att=att||attMonth(e,m);
  return kpiFor(e).map(k=>{let v;
    if(k.src==='sales_count')v=sl.length;else if(k.src==='sales_value')v=round(sl.reduce((s,x)=>s+x.value,0)/1e6);else if(k.src==='late_count')v=att.q+att.h+att.f;else if(k.src==='absent_count')v=att.ae+att.au;else v=vals[k.id];
    const t=k.mode==='target'?kpiTarget(k,e):null;
    if(v===undefined||v===null||v==='')return{id:k.id,name:k.name,unit:k.unit||'',v:null,t,amount:0,missing:true};
    const r=kpiRule(k,v,e);return{id:k.id,name:k.name,unit:k.unit||'',v,t,amount:r.amount,note:r.note};
  });
}
function kpiForm(id){
  const k=id?S.kpi[id]:null,emps=arr('emp').filter(e=>e.active!==false);
  const st=k?JSON.parse(JSON.stringify(k)):{name:'',unit:'',src:'manual',active:true,mode:'target',target:0,penalty:0,ptype:'value',penalties:[],btype:'times',bonuses:[{at:2,amount:0}],emps:[],targets:{}};
  if(st.mode!=='target'){st.mode='target';st.target=st.target||0;st.bonuses=st.bonuses||[];st.penalties=st.penalties||[];st.targets=st.targets||{}}
  st.targets=st.targets||{};st.penalties=st.penalties||[];st.bonuses=st.bonuses||[];
  openModal(`<h2>${k?'تعديل بند KPI':'بند KPI جديد'}</h2>
  <div class="form">
    <div class="f full"><label>اسم البند *</label><input id="k_name" value="${esc(st.name)}" placeholder="مثال: الإعلانات المنشورة"></div>
    <div class="f"><label>وحدة القياس</label><input id="k_unit" value="${esc(st.unit)}" placeholder="إعلان / زيارة / بيعة"></div>
    <div class="f"><label>مصدر الرقم</label><select id="k_src">${Object.entries(KPI_SRC).map(([a,b])=>`<option value="${a}" ${st.src===a?'selected':''}>${b}</option>`).join('')}</select></div>
    <div class="f"><label>🎯 المطلوب شهرياً (من غير بونص)</label><input id="k_t" type="number" step="any" value="${st.target||''}" placeholder="مثال: 200"></div>
    <div class="f"><label>🔻 الخصم لو حقق أقل من المطلوب</label><input id="k_p" type="number" step="any" value="${st.penalty||''}" placeholder="مثال: 500"></div>
  </div>
  <h3 class="mt" style="margin-bottom:4px">🟢 البونص لو عدّى المطلوب</h3>
  <div class="row" style="margin-bottom:8px"><span class="muted">مستوى البونص بيتحسب:</span><select id="k_bt" onchange="_k.btype=this.value;kDraw()"><option value="times" ${st.btype==='times'?'selected':''}>بالأضعاف (2 = الضعف)</option><option value="value" ${st.btype!=='times'?'selected':''}>برقم ثابت (مثلاً 10 زيارات)</option></select></div>
  <div id="k_b"></div><button class="btn sm" onclick="_k.bonuses.push({at:'',amount:''});kDraw()">+ مستوى بونص</button>
  <details class="mt"><summary class="muted" style="cursor:pointer">خصم متدرج (اختياري) — لو عايز خصم أكبر كل ما الرقم يقل أكتر</summary>
    <div class="row mt" style="margin-bottom:8px"><span class="muted">الحد بيتحسب:</span><select id="k_pt" onchange="_k.ptype=this.value;kDraw()"><option value="value" ${st.ptype!=='pct'?'selected':''}>برقم</option><option value="pct" ${st.ptype==='pct'?'selected':''}>% من المطلوب</option></select></div>
    <div id="k_pen"></div><button class="btn sm" onclick="_k.penalties.push({below:'',amount:''});kDraw()">+ مستوى خصم</button>
  </details>
  <h3 class="mt" style="margin-bottom:4px">👥 مين يطبق عليه؟</h3><div class="muted" style="margin-bottom:6px">علّم على الموظفين اللي البند ده عليهم (لو مختارتش حد، هيطبق على الكل). ولو سيلز معيّن ليه رقم مطلوب مختلف اكتبه جنب اسمه.</div>
  <div class="tw"><table><tbody>${emps.map(e=>`<tr><td><label class="row" style="gap:6px"><input type="checkbox" class="k_emp" value="${e.id}" style="width:auto" ${(st.emps||[]).includes(e.id)?'checked':''}> <b>${esc(e.name)}</b> <span class="muted">${esc(e.job||'')}</span></label></td><td><input type="number" step="any" class="k_tg" data-e="${e.id}" style="width:130px" value="${st.targets[e.id]??''}" placeholder="المطلوب العام"></td></tr>`).join('')||'<tr><td class="muted">أضف موظفين الأول</td></tr>'}</tbody></table></div>
  <div class="card mt" id="k_ex" style="background:var(--pri-soft)"></div>
  <div class="row mt"><label class="chip"><input type="checkbox" id="k_act" ${st.active!==false?'checked':''}> البند مفعّل</label></div>
  <div class="acts"><button class="btn p" id="kSave">حفظ</button><button class="btn" onclick="closeModal()">إلغاء</button></div>`,true);
  window._k=st;
  const ex=()=>{const t=parseFloat($('#k_t').value)||0,p=parseFloat($('#k_p').value)||0,u=$('#k_unit').value||'';

/* fields: {k,label,type,opts,req,full,ph,hint} */
function openForm(title,fields,vals,onSave,opt={}){
  const v=vals||{};
  const fh=fields.map(f=>{
    const val=v[f.k]??f.def??'';const id='f_'+f.k;
    let inp;
    if(f.type==='select')inp=`<select id="${id}" name="${f.k}">${f.opts.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return `<option value="${esc(a)}" ${String(a)===String(val)?'selected':''}>${esc(b)}</option>`}).join('')}</select>`;
    else if(f.type==='textarea')inp=`<textarea id="${id}" name="${f.k}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}">${esc(val)}</textarea>`;
    else if(f.type==='checkbox')return `<div class="f chk ${f.full?'full':''}"><input type="checkbox" id="${id}" name="${f.k}" ${val!==false&&val!==''?'checked':''}><label for="${id}">${f.label}</label></div>`;
    else inp=`<input id="${id}" name="${f.k}" type="${f.type||'text'}" ${f.type==='number'?'step="any" inputmode="decimal"':''} value="${esc(val)}" placeholder="${esc(f.ph||'')}">`;
    return `<div class="f ${f.full?'full':''}"><label for="${id}">${f.label}${f.req?' *':''}</label>${inp}${f.hint?`<span class="muted" id="h_${f.k}">${f.hint}</span>`:''}</div>`;
  }).join('');
  openModal(`<h2>${title}</h2><form id="frm" class="form">${fh}</form>${opt.extra||''}<div class="acts"><button class="btn p" id="fSave">حفظ</button><button class="btn" onclick="closeModal()">إلغاء</button></div>`);
  const read=()=>{const o={};fields.forEach(f=>{const el=document.getElementById('f_'+f.k);if(!el)return;o[f.k]=f.type==='number'?(parseFloat(el.value)||0):f.type==='checkbox'?el.checked:el.value.trim()});return o};
  if(opt.onInput){$('#frm').addEventListener('input',e=>opt.onInput(e,read));$('#frm').addEventListener('change',e=>opt.onInput(e,read));opt.onInput({target:{}},read)}
  $('#frm').addEventListener('submit',e=>e.preventDefault());
  $('#fSave').onclick=()=>{
    const o=read();
    for(const f of fields){if(f.req&&(o[f.k]===''||o[f.k]===0&&f.type==='number'&&f.nz)){toast('من فضلك أدخل: '+f.label);return}}
    const r=onSave(o);if(r!==false)closeModal();
  };
}

const UNIT_T=['شقة','دوبلكس','بنتهاوس','فيلا','تاون هاوس','توين هاوس','شاليه','محل تجاري','مكتب إداري','عيادة','أرض','أخرى'];
const FREQ=[[1,'شهري'],[3,'ربع سنوي'],[6,'نصف سنوي'],[12,'سنوي']];
const DEAL_K=['تسويق لمطور','إعادة بيع','إيجار','أخرى'];
const DEAL_S={open:['جارية','b-w'],won:['تمت','b-in'],lost:['ملغية','b-m']};
const projName=id=>(S.proj[id]||{name:'—'}).name;
const projOpts=(blank)=>(blank?[['',blank]]:[]).concat(arr('proj').sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar')).map(p=>[p.id,p.name]));
const unitLabel=id=>{const u=S.unit[id];return u?projName(u.proj)+' — '+u.code:'(وحدة محذوفة)'};
function addMonthsDate(d,k){const[y,m,dd]=d.split('-').map(Number);const x=new Date(Date.UTC(y,m-1+k,1)),last=new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+1,0)).getUTCDate();return x.getUTCFullYear()+'-'+String(x.getUTCMonth()+1).padStart(2,'0')+'-'+String(Math.min(dd,last)).padStart(2,'0')}
const activeCtrOf=uid_=>arr('ctr').find(c=>c.unit===uid_&&c.status!=='cancelled');
function unitStatus(u){if(activeCtrOf(u.id))return['مباعة','b-in','sold'];if(u.status==='reserved')return['محجوزة','b-w','reserved'];return['متاحة','b-p','avail']}
function ctrState(c){
  const paid=round(sumA(arr('tx').filter(t=>t.ctrId===c.id&&t.kind==='in')));let left=paid;const t=today();
  const sch=ctrSchedule(c).map(x=>{const p=Math.min(left,x.amount);left=round(left-p);const st=p>=x.amount-0.01?'paid':x.due<t?'late':p>0?'part':'up';return Object.assign({},x,{paid:round(p),st})});
  const total=round(sch.reduce((s,x)=>s+x.amount,0));
  return{sch,paid,total,remain:round(total-paid),late:round(sch.filter(x=>x.st==='late').reduce((s,x)=>s+x.amount-x.paid,0)),next:sch.find(x=>x.st!=='paid')};
}
const INST_S={paid:['مدفوع','b-in'],late:['متأخر','b-out'],part:['جزئي','b-p'],up:['قادم','b-m']};
function syncComm(cid,on,o){
  const old=S.com[cid];
  if(old&&monthLocked((old.date||'').slice(0,7))){if(on||old)toast('العمولة اتصرفت مع مرتب قبل كده — مش هتتعدل');return}
  if(!on||!o.amount){if(old)del('com',cid);return}
  if(monthLocked(o.date.slice(0,7))){toast('مرتبات '+mName(o.date.slice(0,7))+' اتصرفت — العمولة متسجلتش');return}
  save('com',cid,o);
}
const empOpts=(sel)=>[['','بدون']].concat(arr('emp').filter(e=>e.active!==false||e.id===sel).map(e=>[e.id,e.name]));

    {k:'area',label:'المساحة (م²)',type:'number'},{k:'price',label:'سعر الوحدة',type:'number',req:1,nz:1},
  ],null,o=>{
    const a=Math.round(o.from),b=Math.round(o.to);if(b<a||b-a>300){toast('المدى غير صحيح (أقصى 300 وحدة)');return false}

function projStats(pid){
  const units=arr('unit').filter(u=>u.proj===pid),ctrs=arr('ctr').filter(c=>c.status!=='cancelled'&&S.unit[c.unit]&&S.unit[c.unit].proj===pid);
  const sales=ctrs.reduce((s,c)=>s+ctrState(c).total,0),coll=ctrs.reduce((s,c)=>s+ctrState(c).paid,0);

  const st={avail:0,reserved:0,sold:0};units.forEach(u=>st[unitStatus(u)[2]]++);
  return{units:units.length,st,sales:round(sales),coll:round(coll+otherIn),cost:round(cost),stock:round(units.filter(u=>unitStatus(u)[2]!=='sold').reduce((s,u)=>s+(+u.price||0),0))};
}

  fields.push({k:'note',label:type==='deduct'?'السبب':'ملاحظات',type:'textarea',full:1,rows:2});

const DOW=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const dow=d=>new Date(d+'T12:00:00').getDay();
const isOff=d=>(cfg().weekOff||[4]).map(Number).includes(dow(d));
function shift(d){const c=cfg(),mo=+d.slice(5,7),sm=(c.summerMonths||[]).map(Number).includes(mo);return sm?{s:c.summerIn,e:c.summerOut,n:'مواعيد صيفي'}:{s:c.winterIn,e:c.winterOut,n:'مواعيد شتوي'}}
const tmin=t=>{if(!t)return null;const[h,m]=String(t).split(':').map(Number);return h*60+(m||0)};
function lateInfo(d,tin){if(!tin)return{mins:0,ded:0};const mins=tmin(tin)-tmin(shift(d).s);const r=(cfg().lateRules||[]).slice().sort((a,b)=>b.min-a.min).find(r=>mins>=+r.min);return{mins:Math.max(0,mins),ded:r?+r.ded:0}}
const ATT_S={p:['حاضر','b-in'],ae:['غياب بإذن','b-w'],au:['غياب بدون إذن','b-out'],lv:['إجازة مدفوعة','b-p'],ms:['مأمورية','b-p']};
const dedTxt=x=>x>=1?(x===1?'يوم':x===2?'يومين':x+' يوم'):x===.5?'نص يوم':x===.25?'ربع يوم':x+' يوم';
function attMonth(e,m){
  const c=cfg(),doc=S.att[m+'_'+e.id]||{},days=doc.days||{},dayRate=(+e.base||0)/(+c.workDays||30),hr=dayRate/(+c.workHours||8);
  const r={q:0,h:0,f:0,ae:0,au:0,pres:0,lv:0,dedDays:0,ot:+doc.overtime||0,rows:[]};
  Object.keys(days).sort().forEach(dd=>{const d=m+'-'+dd,x=days[dd];if(!x||!x.s)return;let ded=0,info='';
    if(x.s==='p'){r.pres++;const li=lateInfo(d,x.in);ded=li.ded;if(li.mins)info='تأخير '+li.mins+' دقيقة';if(ded>=1)r.f++;else if(ded>=.5)r.h++;else if(ded>0)r.q++}
    else if(x.s==='ae'){r.ae++;ded=+c.absExcused||0}else if(x.s==='au'){r.au++;ded=+c.absUnexcused||0}else r.lv++;
    if(isOff(d))ded=0;r.dedDays+=ded;r.rows.push({d,s:x.s,in:x.in||'',out:x.out||'',ded,info});
  });
  if(doc.absent)r.dedDays+=+doc.absent;
  r.dedDays=round(r.dedDays);r.dayRate=round(dayRate);
  r.amount=round(r.dedDays*dayRate+(+doc.late||0)*hr);r.otAmount=round(r.ot*hr*(+c.otRate||1.5));
  return r;
}

function salesComm(empId,m){
  const c=cfg(),e=S.emp[empId]||{};if(e.salesComm===false)return[];

  const l=allSales().filter(s=>s.emp===empId&&(s.date||'').startsWith(per)&&s.date.slice(0,7)<=m).sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts);
  const idx={res:0,com:0},out=[];
  l.forEach(s=>{const k=idx[s.cat]++,p=S.proj[s.proj]||{};let start=s.cat==='com'?+c.commComStart:+c.commResStart;if(+p.salesStart)start=+p.salesStart;
    let rate=round(start+k*(s.cat==='com'?+c.commComStep:+c.commResStep));if(+c.commMax)rate=Math.min(rate,+c.commMax);

  return out;
}

function calcLine(e,m){
  const c=cfg(),base=+e.base||0,allow=+e.allow||0,adjs=arr('adj').filter(a=>a.empId===e.id);
  const bonusL=adjs.filter(a=>a.type==='bonus'&&a.month===m),dedL=adjs.filter(a=>a.type==='deduct'&&a.month===m);
  const advL=adjs.filter(a=>a.type==='advance').map(a=>{const n=Math.max(1,+a.installments||1),k=monthDiff(a.month,m);return{date:a.date,note:(n>1?`قسط ${k+1} من ${n}`:'سلفة')+(a.note?' — '+a.note:''),amount:k>=0&&k<n?round((+a.amount||0)/n):0}}).filter(x=>x.amount);
  const sales=salesComm(e.id,m),man=manualCom(e.id,m).map(x=>({date:x.date,label:x.client||x.note||'عمولة',value:+x.sales||0,rate:+x.rate||0,amount:+x.amount||0}));
  const att=attMonth(e,m),kp=kpiEval(e,m,att);
  const comm=round(sumA(sales)+sumA(man)),kpiPlus=round(kp.reduce((s,x)=>s+(x.amount>0?x.amount:0),0)),kpiMinus=round(-kp.reduce((s,x)=>s+(x.amount<0?x.amount:0),0));
  const ins=round(base*(+c.insurance||0)/100),bonus=round(sumA(bonusL)),deduct=round(sumA(dedL)),adv=round(sumA(advL)),ot=att.otAmount,attDed=att.amount;
  const gross=round(base+allow+comm+kpiPlus+bonus+ot);
  return{empId:e.id,name:e.name,job:e.job||'',base,allow,comm,kpiPlus,bonus,ot,gross,attDed,kpiMinus,deduct,adv,ins,net:round(gross-attDed-kpiMinus-deduct-adv-ins),absent:att.ae+att.au,kpiMissing:kp.filter(x=>x.missing).length,
    det:{sales:sales.map(s=>({date:s.date,label:s.label,cat:s.cat,value:s.value,n:s.n,rate:s.rate,amount:s.amount})),man,kpi:kp,
      att:{q:att.q,h:att.h,f:att.f,ae:att.ae,au:att.au,pres:att.pres,lv:att.lv,dedDays:att.dedDays,dayRate:att.dayRate,ot:att.ot,rows:att.rows.filter(r=>r.ded>0)},
      bonus:bonusL.map(a=>({date:a.date,amount:+a.amount||0,note:a.note||''})),ded:dedL.map(a=>({date:a.date,amount:+a.amount||0,note:a.note||''})),adv:advL}};
}
const PKEYS=['base','allow','comm','kpiPlus','bonus','ot','gross','attDed','kpiMinus','deduct','adv','ins','net'];
function calcPayroll(m){
  const lines=activeEmps(m+'-31').map(e=>calcLine(e,m));
  const tot={};PKEYS.forEach(k=>tot[k]=round(lines.reduce((s,l)=>s+(l[k]||0),0)));
  return{lines,tot};
}

function ctrSchedule(c){
  const price=round((+c.price||0)-(+c.discount||0)),down=+c.down||0,delivery=+c.delivery||0,n=Math.max(0,Math.round(+c.n||0)),rest=round(price-down-delivery),per=n?Math.floor(rest/n*100)/100:0,s=[];
  if(down>0)s.push({k:0,label:'مقدم',due:c.date,amount:down});
  for(let i=1;i<=n;i++)s.push({k:i,label:'قسط '+i,due:addMonthsDate(c.start||c.date,(i-1)*(+c.freq||1)),amount:i===n?round(rest-per*(n-1)):per});
  if(!n&&rest>0)s.push({k:1,label:'باقي الثمن',due:c.start||c.date,amount:rest});
  if(delivery>0)s.push({k:99,label:'دفعة الاستلام',due:c.deliveryDate||c.start||c.date,amount:delivery});
  return s.sort((a,b)=>a.due.localeCompare(b.due)||a.k-b.k);
}

function searchResults(q){
  q=q.trim().toLowerCase();if(!q)return'';const r=[];
  arr('cust').filter(c=>[c.name,c.phone,c.nid].join(' ').toLowerCase().includes(q)).slice(0,6).forEach(c=>r.push(`<div class="it"><div><b>👤 ${esc(c.name)}</b><div class="muted">${esc(c.phone||'')}</div></div><button class="btn sm" onclick="custStatement('${c.id}')">كشف حساب</button></div>`));
  arr('unit').filter(u=>[u.code,projName(u.proj),u.type].join(' ').toLowerCase().includes(q)).slice(0,6).forEach(u=>{const s=unitStatus(u),c=activeCtrOf(u.id);r.push(`<div class="it"><div><b>🏠 ${esc(unitLabel(u.id))}</b> <span class="badge ${s[1]}">${s[0]}</span><div class="muted">${esc(u.type||'')} ${u.area?u.area+' م²':''} · ${fmt(u.price)}</div></div>${c?`<button class="btn sm" onclick="ctrView('${c.id}')">العقد</button>`:`<button class="btn sm" onclick="quoteModal(null,'${u.id}')">عرض سعر</button>`}</div>`)});
  arr('proj').filter(p=>[p.name,p.location,p.developer].join(' ').toLowerCase().includes(q)).slice(0,4).forEach(p=>r.push(`<div class="it"><div><b>🏗️ ${esc(p.name)}</b><div class="muted">${esc(p.location||'')}</div></div><button class="btn sm" onclick="UI.projTab='u';UI.unitProj='${p.id}';location.hash='projects'">الوحدات</button></div>`));
  arr('ctr').filter(c=>String(c.seq)===q).forEach(c=>r.push(`<div class="it"><b>📑 عقد ${c.seq} — ${esc(custName(c.cust))}</b><button class="btn sm" onclick="ctrView('${c.id}')">فتح</button></div>`));
  return `<div class="card mt">${r.length?`<div class="list">${r.join('')}</div>`:'<div class="empty">مفيش نتائج</div>'}</div>`;
}

function addReCats(){const d=DEF_CFG,lines=id=>$(id).value.split('\n').map(s=>s.trim()).filter(Boolean);const a=lines('#sInc'),b=lines('#sExp');d.incomeCats.forEach(x=>{if(!a.includes(x))a.push(x)});d.expenseCats.forEach(x=>{if(!b.includes(x))b.push(x)});$('#sInc').value=a.join('\n');$('#sExp').value=b.join('\n');toast('اتضافت — اضغط حفظ')}
function saveCfg(){
  const lines=id=>$(id).value.split('\n').map(s=>s.trim()).filter(Boolean),num=(id,d)=>{const v=parseFloat($(id).value);return isNaN(v)||v<0?d:v},str=(id,d)=>$(id).value.trim()||d;

  save('cfg','main',Object.assign({},S.cfg.main||{},{company:str('#sCo','شركتي'),waNumber:str('#sWa',''),phone:str('#sPh',''),address:str('#sAd',''),currency:str('#sCur','ج.م'),vat:num('#sVat',0),invPrefix:$('#sPre').value.trim(),

    winterIn:str('#sWi','10:00'),winterOut:str('#sWo','18:00'),summerIn:str('#sSi','11:00'),summerOut:str('#sSo','19:00'),
    summerMonths:[...document.querySelectorAll('.sSm:checked')].map(x=>+x.value),weekOff:[...document.querySelectorAll('.sWo:checked')].map(x=>+x.value),
    lateRules:lr,absExcused:num('#sAe',1),absUnexcused:num('#sAu',2),workDays:num('#sWd',30)||30,workHours:num('#sWh',8)||8,otRate:num('#sOt',1.5),insurance:num('#sIns',0),
    incomeCats:lines('#sInc'),expenseCats:lines('#sExp')}));
  toast('تم حفظ الإعدادات');
}

const DOC_CSS=`.kd{width:794px;background:#fff;color:#1b1b1b;font-family:'IBM Plex Sans Arabic',Cairo,Tahoma,Arial,sans-serif;direction:rtl;padding:28px 34px;box-sizing:border-box;font-size:14px;line-height:1.55}
.kd-h{display:flex;align-items:center;gap:14px;border-bottom:3px solid #b8892f;padding-bottom:14px}.kd-h img{width:80px;height:80px;border-radius:50%;flex-shrink:0}
.kd-co{font-size:21px;font-weight:800;color:#5a1020}.kd-sub{font-size:12px;color:#666;margin-top:3px}.kd-t{margin-right:auto;text-align:left;display:flex;flex-direction:column;gap:3px}.kd-t b{font-size:17px;color:#0f766e}.kd-t span{font-size:12px;color:#777}
.kd-b{padding-top:14px}.kd-b table{width:100%;border-collapse:collapse;margin:8px 0}.kd-b th,.kd-b td{border:1px solid #e4e4e4;padding:6px 8px;text-align:right;font-size:12.5px}.kd-b th{background:#f7f1e4;color:#5a1020}.kd-b tfoot td{background:#faf7f0;font-weight:700}
.kd-b h4{margin:16px 0 6px;color:#5a1020;font-size:15px}.kd-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #ddd}.kd-tot{font-size:19px;font-weight:800;color:#0f766e;border-bottom:none;padding-top:10px}
.kd-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}.kd-box{border:1px solid #eadfc8;background:#fdfaf3;border-radius:10px;padding:10px 14px;margin-top:10px}.kd-f{margin-top:22px;border-top:1px solid #eee;padding-top:8px;font-size:11px;color:#999;text-align:center}

  try{await firebase.auth().sendPasswordResetEmail(em);$('#lerr').style.color='var(--in)';$('#lerr').textContent='لو الإيميل متسجل، هيوصلك لينك تغيّر بيه الباسورد (شوف الـ Spam كمان)'}catch(e){$('#lerr').style.color='';$('#lerr').textContent=authMsg(e)}}
function fbLogout(){confirmBox('تسجيل خروج من البرنامج على الجهاز ده؟',async()=>{try{await firebase.auth().signOut()}catch(e){}location.reload()},'خروج','p')}
function cfgBox(){$('#cfgbox').classList.toggle('hidden');$('#cfgtxt').value=JSON.stringify(fbCfg(),null,1)}
function cfgSave(){const t=$('#cfgtxt').value,o={};['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'].forEach(k=>{const m=t.match(new RegExp(k+'["\']?\\s*:\\s*["\']([^"\']+)["\']'));if(m)o[k]=m[1]});
  if(!o.apiKey||!o.projectId){$('#lerr').textContent='الكود ناقص — لازم يكون فيه apiKey و projectId';return}
  try{localStorage.setItem('fb_cfg',JSON.stringify(o))}catch(e){}location.reload()}
function cfgClear(){try{localStorage.removeItem('fb_cfg')}catch(e){}location.reload()}

init();
</script>
</body>
</html>
